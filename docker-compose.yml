services:
  app:
    build: .
    container_name: insighteye_app
    restart: always
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
    # networks:
    #   - insighteye_network
    network_mode: "host"  
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # dns:
    #   - 8.8.8.8
    #   - 8.8.4.4
    shm_size: '2gb'
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

