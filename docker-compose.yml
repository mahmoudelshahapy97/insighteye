services:
  redis:
    image: redis:7-alpine
    container_name: insighteye_redis1
    restart: always
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insighteye_network

  app:
    build: .
    image: insighteye_app1:latest
    container_name: insighteye_app1
    restart: always
    env_file:
      - .env
    environment:
      - OPENCV_FFMPEG_LOGLEVEL=-8
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "${APP_PORT:-8001}:8001"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8001
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - insighteye_network

  celery_worker:
    image: insighteye_app1:latest
    container_name: insighteye_celery_worker1
    restart: always
    env_file:
      - .env
    environment:
      - OPENCV_FFMPEG_LOGLEVEL=-8
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=100
      --task-events
      --without-gossip
      --without-mingle
      --without-heartbeat
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - insighteye_network

volumes:
  redis_data:
    driver: local

networks:
  insighteye_network:
    driver: bridge