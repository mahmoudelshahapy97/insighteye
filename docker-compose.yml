services:
  app:
    build: .
    container_name: insighteye_app
    restart: always
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
      - ./app.log:/app/app.log 
    networks:
      - insighteye_network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

networks:
  insighteye_network:
    driver: bridge