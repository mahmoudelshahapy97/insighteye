name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PUBLIC_HEALTH_URL: https://te-s.xyz/insighteye/health

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://te-s.xyz/insighteye/
    steps:
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=()
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_HOST_FINGERPRINT DEPLOY_PATH; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,SHA
          # A rebuild of the CUDA image can take a long time.
          command_timeout: 90m
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            IMAGE=insighteye_app:latest
            PREV=insighteye_app:previous
            # Free space a rebuild needs on / (the app image alone is ~20 GB).
            MIN_FREE_GB=25

            # A manual prune can leave the running image tagged only :previous.
            if ! docker image inspect "$IMAGE" >/dev/null 2>&1 && docker image inspect "$PREV" >/dev/null 2>&1; then
              echo "==> $IMAGE missing: re-tagging from $PREV"
              docker tag "$PREV" "$IMAGE"
            fi

            OLD=$(git rev-parse HEAD)
            git fetch --prune origin
            git reset --hard "$SHA"
            echo "Deploying $OLD -> $(git rev-parse HEAD)"
            PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2 | tr -d '"' || true)
            URL="http://localhost:${PORT:-8000}/health"

            healthy() {
              # Model loading and the DB pool can take a few minutes on start.
              for _ in $(seq 1 60); do
                curl -fsS -o /dev/null "$URL" && return 0
                sleep 5
              done
              return 1
            }

            free_gb() { df --output=avail -BG / | tail -1 | tr -dc '0-9'; }

            # Never --volumes or system prune -a: redis_data and the running
            # image must stay.
            echo "==> Disk before cleanup"; df -h /
            docker container prune -f
            docker image prune -f # dangling only; keeps :latest/:previous
            docker builder prune -f --filter until=168h

            # Code is bind-mounted into the containers (.:/app), so only image
            # inputs need a rebuild; anything else just needs a restart.
            rebuilt=0
            if git diff --name-only "$OLD" HEAD | grep -qxE 'Dockerfile|\.dockerignore|requirements(-base|-gpu)?\.txt|docker-compose\.yml'; then
              echo "==> Image inputs changed: rebuilding"
              # Check space before touching anything, so a full disk can't
              # leave the running containers half-built.
              if [ "$(free_gb)" -lt "$MIN_FREE_GB" ]; then
                echo "==> Only $(free_gb)G free on /, pruning all build cache"
                docker builder prune -af
              fi
              if [ "$(free_gb)" -lt "$MIN_FREE_GB" ]; then
                df -h /
                echo "::error::Only $(free_gb)G free on /, need ${MIN_FREE_GB}G to rebuild. Containers left untouched."
                exit 1
              fi
              docker image inspect "$IMAGE" >/dev/null 2>&1 && docker tag "$IMAGE" "$PREV"
              docker compose build app
              rebuilt=1
            else
              echo "==> Image inputs unchanged: no rebuild"
            fi

            # A failed `up` must roll back too, not just exit under set -e.
            echo "==> Restart app and worker"
            if ! { docker compose up -d --remove-orphans redis &&
                   docker compose up -d --force-recreate app celery_worker &&
                   echo "==> Health check $URL" && healthy; }; then
              echo "ERROR: start or health check failed, rolling back to $OLD"
              df -h / || true
              docker compose logs --tail 100 app || true
              git reset --hard "$OLD"
              if [ "$rebuilt" = 1 ] && docker image inspect "$PREV" >/dev/null 2>&1; then
                docker tag "$PREV" "$IMAGE"
              fi
              docker compose up -d --force-recreate app celery_worker
              healthy || echo "ERROR: rollback is not healthy either"
              exit 1
            fi

            # :previous only matters for rollback within this deploy; each
            # rebuild re-tags it, so drop it once healthy (~20 GB).
            if [ "$rebuilt" = 1 ]; then docker image rm "$PREV" 2>/dev/null || true; fi
            docker image prune -f
            docker builder prune -f --filter until=168h
            echo "==> Disk after deploy"; df -h /
            echo "Deployed $(git rev-parse --short HEAD)"

      - name: Health check through the load balancer
        run: |
          for _ in $(seq 1 30); do
            if body=$(curl -fsS -m 10 "$PUBLIC_HEALTH_URL"); then
              echo "$body"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: $PUBLIC_HEALTH_URL not healthy" >&2
          exit 1
